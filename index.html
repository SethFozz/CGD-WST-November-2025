<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seth Fozz — School Projects</title>

  <style>
    /* Apple-style clean font & spacing */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111;
      line-height: 1.6;
    }

    /* NAVIGATION */
    nav {
      width: 100%;
      padding: 14px 0;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.85);
      border-bottom: 1px solid #e5e5e5;
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      z-index: 999;
    }

    /* keeps nav content centered & prevents clipping */
    .nav-content {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }

    nav .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    nav a {
      font-size: 15px;
      text-decoration: none;
      color: #111;
      padding: 6px 12px;
      border-radius: 8px;
      transition: 0.25s;
    }

    nav a:hover {
      background: #f2f2f2;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 20px;
      color: #555;
      max-width: 600px;
      margin: auto;
    }

    /* PROJECT GRID */
    .projects {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
    }

    .card {
      padding: 32px 26px;
      border: 1px solid #eaeaea;
      border-radius: 22px;
      text-align: left;
      cursor: pointer;
      transition: 0.3s;
      background: #fafafa;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.08);
      background: #ffffff;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      font-size: 15px;
      color: #666;
    }

    /* FOOTER */
    footer {
      margin-top: 80px;
      padding: 40px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }

    /* MOBILE FIXES */
    @media(max-width: 600px){
      .hero h1 {
        font-size: 34px;
      }
      nav .title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-content">
      <div class="title">Seth School Projects</div>
      <div>
        <a href="https://github.com/SethFozz">GitHub</a>
        <a href="#">About</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="hero">
    <h1>My HTML/CSS Projects</h1>
    <p>Simple, clean, Apple-inspired showcase of my school assignments.</p>
  </div>

  <!-- Project Cards -->
  <div class="projects">

    <!-- Assignment 1 -->
    <a href="Assignment 1 - Seth Fozz Aguilar/" style="text-decoration:none; color:inherit;">
      <div class="card">
        <h2>Assignment 1 — Seth Fozz Aguilar</h2>
        <p>Basic HTML/CSS project.</p>
      </div>
    </a>

    <!-- Assignment 2 -->
    <a href="Assignment 2 - Coffee Shop Website/" style="text-decoration:none; color:inherit;">
      <div class="card">
        <h2>Assignment 2 — Coffee Shop Website</h2>
        <p>A coffee shop layout inspired by modern UI.</p>
      </div>
    </a>

  </div>

  <!-- Footer -->
  <footer>
    © 2025 Seth Aguilar — School Projects
  </footer>

</body>
</html>
